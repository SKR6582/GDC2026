<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stellar Rhythm</title>
    <!-- Use a premium, modern font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="song-select-screen">
            <div class="header">
                <h1>Select a Track</h1>
                <p>Choose your rhythm and start playing</p>
            </div>
            <div id="song-list"></div>
        </div>

        <div id="game-ui" style="display: none;">
            <div class="game-wrapper">
                <canvas id="gameCanvas" width="800" height="900"></canvas>
            </div>
            <div class="instructions">
                <div class="key-hints">
                    <span>D</span>
                    <span>F</span>
                    <span>J</span>
                    <span>K</span>
                </div>
                <p>Hit <code>SPACE</code> to Start/Restart. Hit <code>R</code> to Record.</p>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
