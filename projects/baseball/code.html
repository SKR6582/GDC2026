<script>
        // Simple atmospheric dust particles to simulate stadium floodlight haze
        const container = document.getElementById('particle-container');
        for (let i = 0; i < 20; i++) {
            const dot = document.createElement('div');
            dot.style.position = 'absolute';
            dot.style.width = '2px';
            dot.style.height = '2px';
            dot.style.background = 'rgba(255, 255, 255, 0.3)';
            dot.style.top = Math.random() * 100 + '%';
            dot.style.left = Math.random() * 100 + '%';
            dot.style.borderRadius = '50%';
            dot.animate([
                { transform: 'translateY(0) translateX(0)', opacity: 0 },
                { transform: 'translateY(-100px) translateX(20px)', opacity: 1 },
                { transform: 'translateY(-200px) translateX(0)', opacity: 0 }
            ], {
                duration: 5000 + Math.random() * 5000,
                iterations: Infinity,
                delay: Math.random() * 5000
            });
            container.appendChild(dot);
        }

        // Simulate pitch update
        setInterval(() => {
            const speeds = [148, 149, 147, 151, 145];
            const types = ['Sinker', 'Fastball', 'Slider', 'Changeup'];
            const speedEl = document.querySelector('.font-pitch-speed.text-pitch-speed');
            const typeEl = document.querySelector('.font-score-display.text-player-name.text-secondary-container');
            
            if (speedEl && typeEl) {
                const s = speeds[Math.floor(Math.random() * speeds.length)];
                const t = types[Math.floor(Math.random() * types.length)];
                speedEl.innerHTML = `${s} <span class="text-body-md font-body-md text-on-surface-variant">km/h</span>`;
                typeEl.innerText = t;
            }
        }, 8000);
    </script>
