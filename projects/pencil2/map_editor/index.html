<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Pencil 2 - 통합 맵 & 그리드 에디터</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 좌측 사이드바: 맵 관리 & 배경 이미지 얼라인 -->
  <div class="sidebar">
    <div class="panel-section">
      <div class="panel-title">맵 패키지 선택</div>
      <div class="form-group">
        <label>현재 룸 폴더</label>
        <select id="room-select"></select>
      </div>
      <div style="display: flex; gap: 6px;">
        <button id="btn-load-room" style="flex:1;">불러오기</button>
        <button id="btn-new-room" style="flex:1;">새 맵</button>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-title">그리드 규격 (Grid Spec)</div>
      <div class="form-group">
        <label>가로 칸수 (Width)</label>
        <input type="number" id="grid-w" value="16" min="8" max="40">
      </div>
      <div class="form-group">
        <label>세로 칸수 (Height)</label>
        <input type="number" id="grid-h" value="11" min="6" max="30">
      </div>
      <div class="form-group">
        <label>타일 크기 (Tile Size: px)</label>
        <input type="number" id="tile-size" value="48" min="24" max="96">
      </div>
      <button id="btn-apply-grid">그리드 크기 적용</button>
    </div>

    <div class="panel-section">
      <div class="panel-title">배경 이미지 정렬 (Aligner)</div>
      <button id="btn-select-bg" style="width: 100%; margin-bottom: 8px;">배경 이미지 선택</button>
      <div class="form-group">
        <label>스케일 (Scale): <span id="val-bg-scale">1.0</span></label>
        <input type="range" id="bg-scale" min="0.2" max="3.0" step="0.05" value="1.0">
      </div>
      <div class="form-group">
        <label>오프셋 X: <span id="val-bg-ox">0</span>px</label>
        <input type="range" id="bg-ox" min="-400" max="400" step="2" value="0">
      </div>
      <div class="form-group">
        <label>오프셋 Y: <span id="val-bg-oy">0</span>px</label>
        <input type="range" id="bg-oy" min="-400" max="400" step="2" value="0">
      </div>
      <div class="form-group">
        <label>배경 투명도: <span id="val-bg-alpha">1.0</span></label>
        <input type="range" id="bg-alpha" min="0.1" max="1.0" step="0.05" value="0.9">
      </div>
    </div>

    <button id="btn-save-room" class="primary" style="padding: 10px;">★ 맵 저장 (Save Map)</button>

    <div class="panel-section" style="margin-top: 10px;">
      <div class="panel-title">뷰포트 네비게이션</div>
      <div style="display: flex; gap: 6px; margin-bottom: 6px;">
        <button id="btn-zoom-out" style="flex:1;">- 축소</button>
        <button id="btn-zoom-reset" style="flex:1;">100%</button>
        <button id="btn-zoom-in" style="flex:1;">+ 확대</button>
      </div>
      <div style="font-size: 11px; color: #a8a095; line-height: 1.4;">
        • <b>휠 스크롤</b>: 줌 인 / 줌 아웃<br>
        • <b>휠 클릭 드래그</b> 또는 <b>SPACE + 좌클릭</b>: 화면 이동 (Pan)
      </div>
    </div>
  </div>

  <!-- 중앙: 캔버스 작업 뷰포트 -->
  <div class="canvas-container" id="canvas-wrapper">
    <canvas id="editor-canvas"></canvas>
    <div class="status-bar" id="status-bar">타일: [0, 0] | 줌: 100% | 툴: 길 (Walkable)</div>
  </div>


  <!-- 우측 사이드바: 타일 & 엔티티 팔레트 -->
  <div class="sidebar right">
    <div class="panel-section">
      <div class="panel-title">타일 레이어</div>
      <div class="palette-grid">
        <button class="palette-btn active" data-tool="tile" data-val="0">
          <span class="color-dot" style="background:#b8895c;"></span> 길 (0)
        </button>
        <button class="palette-btn" data-tool="tile" data-val="1">
          <span class="color-dot" style="background:#4a3428;"></span> 벽 (1)
        </button>
        <button class="palette-btn" data-tool="tile" data-val="4">
          <span class="color-dot" style="background:#9c3cf0;"></span> 포탈 (4)
        </button>
        <button class="palette-btn" data-tool="tile" data-val="5">
          <span class="color-dot" style="background:#b82a2a;"></span> 잠긴 문 (5)
        </button>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-title">스폰 & 기믹 레이어</div>
      <div class="palette-grid">
        <button class="palette-btn" data-tool="spawn" data-val="player">
          <span class="color-dot" style="background:#3b82f6;"></span> 시작 (연필깎이)
        </button>
        <button class="palette-btn" data-tool="entity" data-val="pencil">
          <span class="color-dot" style="background:#eab308;"></span> 낡은 연필
        </button>
        <button class="palette-btn" data-tool="entity" data-val="lead">
          <span class="color-dot" style="background:#64748b;"></span> 샤프심
        </button>
        <button class="palette-btn" data-tool="entity" data-val="spring">
          <span class="color-dot" style="background:#d97706;"></span> 녹슨 용수철
        </button>
        <button class="palette-btn" data-tool="entity" data-val="highlighter">
          <span class="color-dot" style="background:#ec4899;"></span> 핑크 형광펜
        </button>
        <button class="palette-btn" data-tool="entity" data-val="eraser">
          <span class="color-dot" style="background:#06b6d4;"></span> 지우개
        </button>
        <button class="palette-btn" data-tool="entity" data-val="boss">
          <span class="color-dot" style="background:#8b5cf6;"></span> 필통 보스
        </button>
        <button class="palette-btn" data-tool="entity" data-val="puzzle">
          <span class="color-dot" style="background:#e5a93c;"></span> 퍼즐 기믹
        </button>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-title">포탈 / 퍼즐 속성 편집</div>
      <div class="form-group">
        <label>포탈 타겟 룸 ID</label>
        <input type="text" id="prop-portal-target" value="room_2">
      </div>
      <div class="form-group">
        <label>필요 아이템 (옵션)</label>
        <input type="text" id="prop-portal-item" placeholder="예: boss_key">
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
